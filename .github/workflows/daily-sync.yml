name: Daily Sync (harga + fundamental + sinyal)

# Update harga + fundamental + pindai sinyal, untuk SAHAM YANG SUDAH ADA di DB.
# Jalankan seed-data.yml dulu untuk DB kosong.
#
# Mode `penuh` menggantikan `POST /stocks/refresh` yang dihapus 3 Sep 2026.
# Pakai ia kalau cron sempat mati lebih dari 5 hari: mode `harian` menarik
# `period="5d"` yang selalu dihitung dari HARI INI, jadi ia tak akan pernah
# menyentuh hari yang terlewat — lubangnya menetap sampai mode `penuh` dijalankan.
on:
  # ── CRON GITHUB DIMATIKAN 10 Sep 2026 — pemicunya kini Cloudflare Worker ────
  #
  # BERKAS INI JANGAN DIHAPUS. Worker memicu lewat
  #   POST /repos/McYeremia/Emetiq/actions/workflows/daily-sync.yml/dispatches
  # jadi NAMA BERKAS INI adalah alamatnya (`cloudflare/daily-sync-cron/worker.js`).
  # Menghapusnya membuat Worker menerima 404 tiap hari: cron-nya tetap jalan, tapi
  # tak ada yang dikerjakan — dan tak ada job merah yang memberi tahu.
  #
  # Kenapa jadwalnya dimatikan, bukan sekadar mubazir:
  # `scripts/daily_sync.py` berakhir di `watcher.scan_market_signals()`, dan fungsi
  # itu MENGHAPUS SELURUH tabel `signals` lebih dulu sebelum menghitung ulang selama
  # beberapa menit. Workflow ini tak punya blok `concurrency:`, jadi dua run boleh
  # tumpang tindih. Dengan antrean penjadwal GitHub yang bisa ~4 jam (Run #52:
  # dijadwalkan 17:00 WIB, mulai 20:56), run terjadwal gampang menabrak run yang
  # dipicu Worker. Run kedua mengosongkan tabel; kalau ia gagal di tengah, `signals`
  # tinggal sebagian — dan tabel itu dibaca AI Porto. Persis alasan `POST /stocks/scan`
  # dihapus 3 Sep 2026.
  #
  # Baris di bawah dibiarkan tertulis (bukan dihapus) supaya alasan pemilihan menit 37
  # tak ikut hilang, dan supaya jadwalnya tinggal dinyalakan bila Worker suatu saat
  # pensiun. Pola yang sama dipakai `bigmoney-daily.yml`.
  #
  # schedule:
  #   # 10:37 UTC = 17:37 WIB, hari kerja (Senin-Jumat), setelah pasar IDX tutup.
  #   #
  #   # Menit 37, BUKAN 0. Run #52 dijadwalkan 17:00 WIB tapi baru mulai 20:56 —
  #   # tertunda ~3 jam 56 menit di antrean (durasi jobnya sendiri cuma 44 menit).
  #   # GitHub mendokumentasikan awal tiap jam sebagai puncak beban penjadwal, dan
  #   # `0 10` persis di sana.
  #   #
  #   # Jamnya sengaja TIDAK dimundurkan. Penundaan itu antrean, bukan offset tetap:
  #   # menggeser ke 18:00 hanya memindahkan titik awal jadi lebih larut lagi.
  #   - cron: "37 10 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "harian = 5 hari terakhir · penuh = dari tanggal terakhir tiap saham (tambal lubang, jauh lebih lama)"
        type: choice
        options: [harian, penuh]
        default: harian

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Daily sync ke Supabase
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        # `github.event.inputs`, bukan `inputs`: konteks `inputs` hanya dijamin ada
        # pada workflow_dispatch/workflow_call, sedangkan `github.event` selalu ada
        # dan memberi kosong saat dipicu cron. Kalau ekspresi ini bermasalah yang
        # rusak adalah sinkronisasi harian — bukan tempat untuk berhemat kehati-hatian.
        run: python scripts/daily_sync.py --mode "${{ github.event.inputs.mode || 'harian' }}"
