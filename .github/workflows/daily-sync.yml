name: Daily Sync (harga + fundamental + sinyal)

# Update harga + fundamental + pindai sinyal, untuk SAHAM YANG SUDAH ADA di DB.
# Jalankan seed-data.yml dulu untuk DB kosong.
#
# Mode `penuh` menggantikan `POST /stocks/refresh` yang dihapus 3 Sep 2026.
# Pakai ia kalau cron sempat mati lebih dari 5 hari: mode `harian` menarik
# `period="5d"` yang selalu dihitung dari HARI INI, jadi ia tak akan pernah
# menyentuh hari yang terlewat — lubangnya menetap sampai mode `penuh` dijalankan.
on:
  schedule:
    # 10:37 UTC = 17:37 WIB, hari kerja (Senin-Jumat), setelah pasar IDX tutup.
    #
    # Menit 37, BUKAN 0. Run #52 dijadwalkan 17:00 WIB tapi baru mulai 20:56 —
    # tertunda ~3 jam 56 menit di antrean (durasi jobnya sendiri cuma 44 menit).
    # GitHub mendokumentasikan awal tiap jam sebagai puncak beban penjadwal, dan
    # `0 10` persis di sana.
    #
    # Jamnya sengaja TIDAK dimundurkan. Penundaan itu antrean, bukan offset tetap:
    # menggeser ke 18:00 hanya memindahkan titik awal jadi lebih larut lagi.
    #
    # Kalau perubahan ini berhasil, job akan mulai jam 17:37 — jam yang praktis
    # belum pernah terjadi selama ini, dan cuma ~1,5 jam setelah lelang penutupan
    # IDX. Kalau Yahoo ternyata belum final, `save_ohlcv` menimpa ulang 5 hari
    # terakhir tiap run (lihat komentar "harga bisa berubah jika sebelumnya
    # di-fetch sebelum market close"), jadi run esok hari membetulkannya sendiri.
    - cron: "37 10 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "harian = 5 hari terakhir · penuh = dari tanggal terakhir tiap saham (tambal lubang, jauh lebih lama)"
        type: choice
        options: [harian, penuh]
        default: harian

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Daily sync ke Supabase
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        # `github.event.inputs`, bukan `inputs`: konteks `inputs` hanya dijamin ada
        # pada workflow_dispatch/workflow_call, sedangkan `github.event` selalu ada
        # dan memberi kosong saat dipicu cron. Kalau ekspresi ini bermasalah yang
        # rusak adalah sinkronisasi harian — bukan tempat untuk berhemat kehati-hatian.
        run: python scripts/daily_sync.py --mode "${{ github.event.inputs.mode || 'harian' }}"
